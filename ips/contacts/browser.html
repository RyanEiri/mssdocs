<!DOCTYPE html PUBLIC "-//W3C/DTD HTML 4.01 Transitional//EN"
	"http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
<title>What browser you report!</title>
</head>
<body>
<SCRIPT language="JavaScript1.2" type="text/javascript">
<!-- Code after this will be ignored by older browsers

// Assign user information
var platform = navigator.platform.substr(0,3);
var browser = navigator.appName;
var version = navigator.appVersion.substr(0,1);

// Output user information
document.write('Operating System: ' + platform + '<br>');
document.write('Web Browser: ' + browser + '<br>');
document.write('Browser Version: ' + version + '<br>');

</SCRIPT>


</body>
</html>
